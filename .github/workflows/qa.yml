name: qa

on:
  push:
    branches:
      - main
      - "impl/**"
  pull_request:

jobs:
  qa:
    name: qa (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: erp_meli2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test
      REAL_MELI_HTTP: 0
      APP_URL: http://localhost
      APP_KEY: test-only-key
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: erp_meli2_test
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, openssl, pdo_mysql, phar, session, sodium, zlib
          coverage: none
          tools: composer:v2

      - name: Assert PHP support contract
        run: php -r '$c=json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR); if (($c["require"]["php"] ?? "") !== ">=8.3 <8.6") { fwrite(STDERR, "composer php constraint must be >=8.3 <8.6\n"); exit(1); }'

      - name: Validate Composer
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: QA
        run: composer qa
